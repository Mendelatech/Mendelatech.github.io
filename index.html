<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mendelatech</title>
<meta name="description" content="Enlaces de Mendelatech: Ko-fi, Instagram y GitHub.">
<style>
  :root {
    --bg-top: #241f33;
    --bg-bottom: #14111c;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.10);
    --card-hover: rgba(255,255,255,0.12);
    --primary: #d0bcff;
    --text: #ece6f2;
    --text-muted: #b7aec4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% -10%, var(--bg-top), var(--bg-bottom) 60%);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
  }
  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .avatar {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(208,188,255,0.55);
    box-shadow: 0 8px 30px rgba(103, 80, 164, 0.45);
  }
  h1 {
    margin: 20px 0 4px;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  p.tagline {
    margin: 0 0 32px;
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 320px;
  }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    transition: background-color 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  a.link-card:hover, a.link-card:focus-visible {
    background: var(--card-hover);
    border-color: rgba(208,188,255,0.4);
    transform: translateY(-1px);
  }
  a.link-card:active {
    transform: translateY(0);
  }
  .icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 100%; height: 100%; }
  .label {
    flex: 1;
    text-align: left;
  }
  .label small {
    display: block;
    font-weight: 400;
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-top: 2px;
  }
  footer {
    margin-top: 40px;
    color: var(--text-muted);
    font-size: 0.78rem;
  }
  footer a { color: var(--text-muted); }
</style>
</head>
